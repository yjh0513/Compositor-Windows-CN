name: 功能建议 / Feature request
description: 建议新功能或改进现有功能
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请注意：本移植版对应 macOS 版 1.3.7，跟进上游新功能需要手工移植，可能需要较长时间。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景或不便之处
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望它怎么工作
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: macOS 上游版本是否已有此功能
      options:
        - 是，上游已有（请在下方注明版本或链接）
        - 否，上游没有
        - 不确定
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考（例如 Photoshop 中对应功能）、上游链接等
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意尝试提交 PR 实现它
